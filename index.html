<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayFlow HRMS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="login-page">
    <div class="login-card">
        <div class="brand">
            <div class="logo">D</div>
            <h1>DayFlow</h1>
        </div>

        <p class="subtitle">Human Resource Management System</p>

        <div class="login-tabs">
            <button class="tab active" onclick="selectRole('employee')">Employee</button>
            <button class="tab" onclick="selectRole('admin')">Admin / HR</button>
        </div>

        <form onsubmit="login(event)">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>

            <button class="primary-btn" type="submit">Sign In</button>
        </form>

        <div class="demo-box">
            <strong>Demo Access</strong>
            <p>Use any email and password to continue.</p>
            <p id="roleHint">Login as Employee</p>
        </div>
    </div>
</div>


<!-- MAIN APPLICATION -->
<div id="app" class="app hidden">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo">D</div>
            <span>DayFlow</span>
        </div>

        <nav id="sidebarMenu">
            <!-- Generated by JavaScript -->
        </nav>

        <button class="logout-btn" onclick="logout()">↪ Logout</button>
    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <header class="topbar">
            <div>
                <h2 id="pageTitle">Dashboard</h2>
                <p id="dateText"></p>
            </div>

            <div class="user-info">
                <div class="avatar" id="userAvatar">S</div>
                <div>
                    <strong id="userName">Soumya</strong>
                    <p id="userRole">Employee</p>
                </div>
            </div>
        </header>

        <section id="content"></section>

    </main>
</div>


<script src="script.js"></script>
</body>
</html>
